  var s=document.createElementNS?document.createElementNS('http://www.w3.org/1999/xhtml','script'):document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js';
  s.onload=function(){cb(true);};
  s.onerror=cb.bind(null,false);
  (document.head||document.documentElement).appendChild(s);
}
function sbStatus(text){const el=document.getElementById('cloud-tag');if(el)el.textContent=text;}

function sbInit(){
  if(SB_TRIED)return;SB_TRIED=true;
  sbStatus('CONNECTING\u2026');
  loadSupabaseLib(function(ok){
    if(!ok||!window.supabase){sbStatus('OFFLINE MODE');BOOT_DONE=true;return;}
    try{
      SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{flowType:'implicit'}});
      SB_ONLINE=true;
      SB.auth.onAuthStateChange(function(evt,session){handleSession(session);});
      var resolved=false;
      SB.auth.getSession().then(function(r){resolved=true;handleSession(r&&r.data?r.data.session:null);})
        .catch(function(){resolved=true;handleSession(null);});
      setTimeout(function(){if(!resolved){sbStatus('OFFLINE MODE');handleSession(null);}},6000);
    }catch(e){SB_ONLINE=false;sbStatus('OFFLINE MODE');BOOT_DONE=true;}
  });
}

function phoneHint(){try{return (localStorage.getItem('nex_phone')||'').replace(/\D/g,'');}catch(e){return '';}}
function finishNoUser(){
  BOOT_DONE=true;
  var top=NAV_STACK[NAV_STACK.length-1];
  if(top&&top.s==='splash')finishBoot();
  else if(!STATE||!STATE.currentUser){
    if(top&&['login','onboarding','profile-setup','otp'].indexOf(top.s)<0)replace('login');
  }
}
function handleSession(session){
  if(session&&session.user){
    if(AUTH_UID===session.user.id){
      try{
        var top0=NAV_STACK[NAV_STACK.length-1];
        if(top0&&(top0.s==='otp'||top0.s==='login'))ensureProfile();
      }catch(e){}
      return;
    }
    AUTH_UID=session.user.id;AUTH_TS=Date.now();
    AUTH_EMAIL=session.user.email||null;
    ensureProfile();
  }else{
    if(AUTH_TS&&Date.now()-AUTH_TS<10000&&STATE&&STATE.currentUser){MY_PLAYER_ID=STATE.currentUser;return;}
    AUTH_UID=null;PENDING_SIGNUP=false;
    if(STATE&&STATE.currentUser){MY_PLAYER_ID=STATE.currentUser;}
    else{MY_PLAYER_ID=null;}
    var savedPhone=phoneHint();
    if(savedPhone&&!AUTO_RESTORE_TRIED&&SB&&SB_ONLINE){
      AUTO_RESTORE_TRIED=true;
      try{sbStatus('RESTORING SESSION\u2026');}catch(e){}
      SB.auth.signInWithPassword({email:'demo'+savedPhone+'@phone.sarvam.ai',password:'NexDemo-'+savedPhone+'-26'}).then(function(res){
        if(res&&res.error)finishNoUser();
      }).catch(function(){finishNoUser();});
      return;
    }
    finishNoUser();
  }
}

function ensureProfile(){
  try{
    var cachedUid=null;try{cachedUid=localStorage.getItem('nex_uid');}catch(e){}
    var cachedPid=localStorage.getItem('nex_pid');
    if(cachedPid&&STATE.currentUser===cachedPid&&cachedUid===AUTH_UID){
      MY_PLAYER_ID=cachedPid;BOOT_DONE=true;
      try{finishBoot();}catch(e){navFromSplash();}
      sbListen();loadAppSettings();
    }
  }catch(e){}
  sbStatus('SYNCING\u2026');
  SB.from('profiles').select('player_id,phone,email').eq('id',AUTH_UID).maybeSingle().then(function(res){
    if(res.error){toast('Cloud error: '+(res.error.message||''),'err');BOOT_DONE=true;navFromSplash();return;}
    if(res.data&&res.data.player_id){
      MY_PLAYER_ID=res.data.player_id;
      if(res.data.phone){LOGIN_PHONE=res.data.phone;try{localStorage.setItem('nex_phone',res.data.phone);}catch(e){}}
      loadWorld(function(ok){
        if(!ok){toast('Working offline','err');}
        STATE.currentUser=MY_PLAYER_ID;
        try{localStorage.setItem(LS_KEY,JSON.stringify(STATE));}catch(e){}
        try{localStorage.setItem('nex_pid',MY_PLAYER_ID||'');localStorage.setItem('nex_uid',AUTH_UID||'');}catch(e){}
        BOOT_DONE=true;navFromSplash();sbListen();loadAppSettings();sbStatus('CLOUD ON');
        try{render(false,true);}catch(e){}
      });
    }else{
      loadWorld(function(ok){
        PENDING_SIGNUP=true;BOOT_DONE=true;navFromSplash();sbListen();loadAppSettings();sbStatus('CLOUD ON');
      });
    }
  }).catch(function(){toast('Could not reach the cloud','err');BOOT_DONE=true;navFromSplash();});
}

function navFromSplash(){
  var top=NAV_STACK[NAV_STACK.length-1];
  if(!top)return;
  if(top.s==='splash'){finishBoot();return;}
  if(top.s==='login'||top.s==='otp'||top.s==='onboarding'){
    if(STATE.currentUser)replace('home');
    else if(PENDING_SIGNUP)replace('profile-setup',{signup:true});
    return;
  }
  render(false,true);
}

function mapNotifRow(row){
  var e=row.data||{};
  if(row.target_player)e=Object.assign({},e,{target:row.target_player});
  return e;
}
function loadWorld(cb){
  var reqs=WORLD_TABLES.map(function(w){
    if(w[1]==='notifications'){
      return SB.from('notifications').select('*').or('target_player.is.null'+(MY_PLAYER_ID?(',target_player.eq.'+MY_PLAYER_ID):''));
    }
    return SB.from(w[1]).select('*');
  });
  Promise.all(reqs).then(function(results){
    var failed=false;
    results.forEach(function(r,i){
      if(r.error||!r.data){failed=true;return;}
      var key=WORLD_TABLES[i][0];
      STATE[key]=r.data.map(function(row){return (WORLD_TABLES[i][1]==='notifications')?mapNotifRow(row):row.data;});
    });
    if(failed)toast('Some data failed to load','err');
    normalizeWorld();refreshSnapshot();
    if(cb)cb(!failed);
  }).catch(function(){if(cb)cb(false);});
}
function normalizeWorld(){
  try{
    (STATE.teams||[]).forEach(function(t){
      if(!t.members||t.members.length<2)return;
      var rank={LEADER:0,ACTING_LEADER:1,OFFICER:2,MEMBER:3};
      var seen={},out=[];
      t.members.forEach(function(m){
        if(!m||!m.playerId)return;
        if(Object.prototype.hasOwnProperty.call(seen,m.playerId)){
          var pr=rank[seen[m.playerId].role];var cr=(rank[m.role]==null?3:rank[m.role]);
          if(cr<pr)out[out.indexOf(seen[m.playerId])]=m;
          return;
        }
        seen[m.playerId]=m;out.push(m);
      });
      t.members=out;
    });
    var seenR={},outR=[];
    (STATE.tournamentRequests||[]).forEach(function(r){
      if(!r||!r.teamId||!r.tournamentId){outR.push(r);return;}
      var k2=r.teamId+'|'+r.tournamentId;
      if(Object.prototype.hasOwnProperty.call(seenR,k2)){
        var old=seenR[k2];var nt=r.time||0,ot=old.time||0;
        var kp=(r.status==='PENDING')?1:0,op=(old.status==='PENDING')?1:0;
        if(kp>op||(kp===op&&nt>=ot)){outR[outR.indexOf(old)]=r;seenR[k2]=r;}
        return;
      }
      seenR[k2]=r;outR.push(r);
    });
    STATE.tournamentRequests=outR;
    (STATE.teams||[]).forEach(function(t){
      if(!t.members)t.members=[];
      t.members=t.members.filter(function(m){return m&&m.playerId&&P(m.playerId);});
      if(t.leader&&P(t.leader)&&!t.members.some(function(m){return m.playerId===t.leader;})){
        t.members.unshift({playerId:t.leader,role:ROLE.LEADER});
      }
      if(!t.leader||!P(t.leader)){
        var first=t.members[0];
        if(first){first.role=ROLE.LEADER;t.leader=first.playerId;}
      }
      if(STATE.currentUser&&t.leader===STATE.currentUser){
        var mine=null;
        t.members.forEach(function(m){if(m.playerId===STATE.currentUser)mine=m;});
        if(mine)mine.role=ROLE.LEADER;
      }
    });
    STATE.teams=(STATE.teams||[]).filter(function(t){return t.members&&t.members.length&&t.leader&&P(t.leader);});
    if(typeof NEX_LOGO_PNG!=='undefined'&&NEX_LOGO_PNG){STATE.teams.forEach(function(t){if(!t.logo)t.logo=NEX_LOGO_PNG;});}
    if(typeof TOUR_BANNERS!=='undefined'){STATE.tournaments.forEach(function(t){if(!t.banner&&TOUR_BANNERS[t.id])t.banner=TOUR_BANNERS[t.id];});}
  }catch(e){}
  try{setTimeout(function(){expireOldTournaments();},1500);}catch(e2){}
  (STATE.players||[]).forEach(function(p){if(!p.stats)p.stats={matches:0,goals:0,assists:0,wins:0};});
}
function refreshSnapshot(){
  var snap={};
  WORLD_TABLES.forEach(function(w){
    var m={};
    (STATE[w[0]]||[]).forEach(function(e){if(e&&e.id!=null)m[e.id]=JSON.stringify(e);});
    snap[w[0]]=m;
  });
  WORLD_SNAP=snap;
}

/* ---- write path: diff STATE vs snapshot, push allowed rows ---- */
function rowFor(table,e){
  switch(table){
    case 'players':return {id:e.id,uid:e.uid||null,name:e.name||'',data:e};
    case 'teams':return {id:e.id,name:e.name||'',leader_player:e.leader||null,data:e};
    case 'tournaments':return {id:e.id,name:e.name||'',organizer_team:e.organizerTeam||null,status:e.status||null,data:e};
    case 'matches':return {id:e.id,tournament:e.tournament||null,team_a:e.teamA||null,team_b:e.teamB||null,status:e.status||null,data:e};
    case 'challenges':return {id:e.id,data:e};
    case 'team_join_requests':return {id:e.id,team_id:e.teamId||null,player_id:e.playerId||null,data:e};
    case 'tournament_requests':return {id:e.id,tournament_id:e.tournamentId||null,team_id:e.teamId||null,data:e};
    case 'payment_approvals':return {id:e.id,team_id:e.teamId||null,data:e};
    case 'notifications':return {id:e.id,target_player:(e&&e.target)||null,data:e};
  }
  return null;
}
function isMemberOfTeam(t){var mp=MY_PLAYER_ID||(STATE&&STATE.currentUser);if(!t||!mp)return false;return (t.members||[]).some(function(m){return m.playerId===mp;});}
function myTeamEntity(){var mp=MY_PLAYER_ID||(STATE&&STATE.currentUser);if(!mp)return null;return STATE.teams.find(function(t){return isMemberOfTeam(t);})||null;}
function canWriteEntity(table,e){
  var mp=MY_PLAYER_ID||(STATE&&STATE.currentUser);
  if(!mp)return false;
  var mt=myTeamEntity();
  switch(table){
    case 'players':return e.id===mp;
    case 'teams':return isMemberOfTeam(e);
    case 'tournaments':return !!mt&&e.organizerTeam===mt.id;
    case 'matches':return (!!mt&&(e.teamA===mt.id||e.teamB===mt.id))||(!!mt&&STATE.tournaments.some(function(tr){return tr.id===e.tournament&&tr.organizerTeam===mt.id;}));
    case 'challenges':return !!mt&&(e.fromTeam===mt.id||e.toTeam===mt.id);
    case 'team_join_requests':return e.playerId===mp||(!!mt&&e.teamId===mt.id);
    case 'tournament_requests':return (!!mt&&e.teamId===mt.id)||(!!mt&&STATE.tournaments.some(function(tr){return tr.id===e.tournamentId&&tr.organizerTeam===mt.id;}));
    case 'payment_approvals':return !!mt&&e.teamId===mt.id;
    case 'notifications':return !e.target||e.target===mp;
  }
  return false;
}
function scheduleSync(){
  if(!SB_ONLINE||!AUTH_UID)return;
  if(SB_PUSHING){SB_DIRTY=true;return;}
  clearTimeout(SB_PUSH_TIMER);
  SB_PUSH_TIMER=setTimeout(pushChanges,800);
}
function pushChanges(){
  if(!SB_ONLINE||!AUTH_UID||SB_PUSHING||!WORLD_SNAP)return;
  SB_PUSHING=true;
  var ops=[];
  WORLD_TABLES.forEach(function(w){
    var key=w[0],table=w[1];
    var snap=WORLD_SNAP[key]||{};
    var cur={};
    (STATE[key]||[]).forEach(function(e){
      if(!e||e.id==null)return;
      cur[e.id]=true;
      var j=JSON.stringify(e);
      if(snap[e.id]!==j&&canWriteEntity(table,e))ops.push({t:table,op:(snap[e.id]?'update':'insert'),row:rowFor(table,e),key:key});
    });
    Object.keys(snap).forEach(function(id){
      if(!cur[id]){
        try{var e=JSON.parse(snap[id]);if(canWriteEntity(table,e))ops.push({t:table,op:'delete',id:id});}catch(err){}
      }
    });
  });
  var finish=function(){SB_PUSHING=false;refreshSnapshot();if(SB_DIRTY){SB_DIRTY=false;scheduleSync();}};
  if(!ops.length){finish();return;}
  var chain=Promise.resolve();
  ops.forEach(function(o){
    chain=chain.then(function(){
      if(o.op==='insert')return SB.from(o.t).upsert(o.row,{onConflict:'id'});
      if(o.op==='update')return SB.from(o.t).update(o.row).eq('id',o.row.id);
      return SB.from(o.t).delete().eq('id',o.id);
    }).then(function(res){
      if(res&&res.error)console.warn('sync skipped:',o.t,res.error.message);
    }).catch(function(){});
  });
  chain.then(finish,finish);
}

/* ---- realtime: adopt other devices' changes ---- */
function sbListen(){
  if(SB_CHANNEL||!SB)return;
  try{
    var ch=SB.channel('nex-world');
    WORLD_TABLES.forEach(function(w){
      ch.on('postgres_changes',{event:'*',schema:'public',table:w[1]},function(){sbTableChanged(w[1]);});
    });
    ch.on('postgres_changes',{event:'*',schema:'public',table:'app_settings'},function(){loadAppSettings();});
    ch.subscribe();
    SB_CHANNEL=ch;
  }catch(e){}
}
function loadAppSettings(){
  if(!SB_ONLINE||!AUTH_UID)return;
  SB.from('app_settings').select('*').eq('id','main').maybeSingle().then(function(res){
    if(res.error||!res.data||!res.data.data)return;
    APP_SETTINGS=res.data.data||{};
    APP_LOGO_URL=APP_SETTINGS.logo||null;
    if(APP_SETTINGS.appName){try{document.title=APP_SETTINGS.appName;}catch(e){}}
    var ae=document.activeElement;
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA'))return;
    try{render(false,true);}catch(e){}
  }).catch(function(){});
}
function sbTableChanged(t){
  if(SB_PUSHING)return;
  clearTimeout(SB_RELOAD_TIMER[t]);
  SB_RELOAD_TIMER[t]=setTimeout(function(){reloadTable(t);},400);
}
function reloadTable(t){
  if(!SB_ONLINE||!AUTH_UID)return;
  var key=null;
  WORLD_TABLES.forEach(function(w){if(w[1]===t)key=w[0];});
  if(!key)return;
  var q=SB.from(t).select('*');
  if(t==='notifications')q=q.or('target_player.is.null'+(MY_PLAYER_ID?(',target_player.eq.'+MY_PLAYER_ID):''));
  q.then(function(res){
    if(res.error||!res.data)return;
    STATE[key]=res.data.map(function(row){return (t==='notifications')?mapNotifRow(row):row.data;});
    normalizeWorld();refreshSnapshot();
    var ae=document.activeElement;
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA'))return;
    render(false,true);
  }).catch(function(){});
}

/* ---- storage uploads ---- */
function compressImageFile(file,cb){
  try{
    if(!file||!(/^image\//.test(file.type||''))){cb(null);return;}
    if(file.size&&file.size<300000){cb(null);return;}
    var img=new Image();
    var url=URL.createObjectURL(file);
    img.onload=function(){
      try{URL.revokeObjectURL(url);}catch(e){}
      try{
        var MAX=1200;var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h){cb(null);return;}
        var sc=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
        cv.toBlob(function(blob){cb(blob||null);},'image/jpeg',0.85);
      }catch(e){cb(null);}
    };
    img.onerror=function(){try{URL.revokeObjectURL(url);}catch(e){}cb(null);};
    img.src=url;
  }catch(e){cb(null);}
}
function uploadToSB(file,bucket,cb){
  try{
    compressImageFile(file,function(blob){
      if(blob){try{file=new File([blob],'img.jpg',{type:'image/jpeg'});}catch(e){}}
      uploadToSBNow(file,bucket,cb);
    });
  }catch(e){uploadToSBNow(file,bucket,cb);}
}
function uploadToSBNow(file,bucket,cb){
  try{
    var ext=(file.name||'img.jpg').split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!ext||ext.length>5)ext='jpg';
    var path=AUTH_UID+'/'+Date.now()+'.'+ext;
    SB.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type||'image/*'}).then(function(res){
      if(res.error){toast('Cloud upload failed \\u2014 saved locally','err');cb(null);return;}
      try{cb(SB.storage.from(bucket).getPublicUrl(path).data.publicUrl);}
      catch(e){cb(null);}
    }).catch(function(){cb(null);});
  }catch(e){cb(null);}
}

/* ---- link a freshly created player to the auth account ---- */
function linkProfile(){
  var e=P(MY_PLAYER_ID);
  if(!e)return;
  SB.from('players').upsert(rowFor('players',e),{onConflict:'id'}).then(function(res){
    return SB.from('profiles').upsert({id:AUTH_UID,phone:LOGIN_PHONE||null,email:AUTH_EMAIL||null,player_id:MY_PLAYER_ID});
  }).then(function(res){
    if(res&&res.error)toast('Profile link failed: '+(res.error.message||''),'err');
    else{sbListen();refreshSnapshot();}
  }).catch(function(){});
}
