<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#030220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEX FOOTBALL">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050A24">
<title>NEX FOOTBALL</title>
<style>
:root{
  --navy:#050A24; --navy-2:#0A1230; --navy-3:#111C4A;
  --line:#26327B; --line-soft:#1A2358;
  --blue:#1A5BFF; --blue-2:#45C8FF;
  --gold:#FFC107; --gold-2:#FFD54D;
  --ok:#22C55E; --err:#EF4444;
  --gray:#A8B3C2; --gray-2:#6B7C93;
  --nav-h:66px; --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#02061B;color:#E8EDF5;overflow:hidden;position:fixed;inset:0;width:100%;font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
#app{max-width:640px;margin:0 auto;height:100dvh;position:relative;background:var(--navy);box-shadow:0 0 80px rgba(0,0,0,.65);overflow:hidden}
#screen-root{height:100%}

/* ===== SCREENS ===== */
.screen{display:flex;flex-direction:column;height:100%;background:var(--navy);position:relative;animation:screenIn .34s var(--ease)}
.screen.no-anim{animation:none}
@keyframes screenIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:translateX(0)}}
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));scrollbar-width:none}
.screen-body::-webkit-scrollbar{display:none}
.screen-body.pane{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,var(--navy-2),var(--navy));position:relative;z-index:5;flex-shrink:0}
.topbar .tb-title{font-size:16px;font-weight:700;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tb-sub{font-size:11px;color:var(--gray-2);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--navy-3);border:1px solid var(--line-soft);color:var(--gray);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{transform:scale(.94)}
.icon-btn.gold{color:var(--gold)}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(10,22,37,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gray-2);font-size:10px;font-weight:700;letter-spacing:.5px;background:none;border:none;position:relative}
.nav-item.active{color:var(--gold)}
.nav-item.active .nav-glow{position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:2px;background:var(--gold)}
.nav-dot{position:absolute;top:9px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* ===== FAB ===== */
.fab{position:absolute;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1A2B3C;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(255,193,7,.35);border:none;z-index:25}
.fab:active{transform:scale(.96)}

/* ===== DEMO TAG ===== */
.demo-tag{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);background:rgba(18,36,55,.85);border:1px solid rgba(255,193,7,.35);color:var(--gold-2);font-size:9px;font-weight:800;letter-spacing:1.2px;padding:4px 12px;border-radius:999px;z-index:100;backdrop-filter:blur(8px);pointer-events:none}

/* ===== CARDS ===== */
.card{background:linear-gradient(180deg,var(--navy-2),#071029);border:1px solid var(--line-soft);border-radius:16px;padding:16px;position:relative;overflow:hidden;margin-bottom:12px}
.card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(69,200,255,.5),transparent)}
.card.flat{background:var(--navy-2)}
.card .card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card .card-title .ico{color:var(--gold)}

/* ===== BUTTONS ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;border:none;font-size:15px;font-weight:700;letter-spacing:.2px;background:var(--navy-3);color:#E8EDF5;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;box-shadow:0 8px 22px rgba(26,91,255,.3)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1A2B3C;box-shadow:0 8px 22px rgba(255,193,7,.25)}
.btn.secondary{background:var(--navy-3);color:#E8EDF5;border:1px solid var(--line)}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--gray)}
.btn.danger{background:rgba(239,68,68,.12);color:var(--err);border:1px solid rgba(239,68,68,.35)}
.btn.sm{padding:8px 14px;border-radius:10px;font-size:12.5px;width:auto}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}

/* ===== BADGES ===== */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.6px;background:var(--navy-3);color:var(--gray);border:1px solid var(--line)}
.badge.blue{background:rgba(26,91,255,.15);color:var(--blue-2);border-color:rgba(26,91,255,.4)}
.badge.gold{background:rgba(255,193,7,.13);color:var(--gold);border-color:rgba(255,193,7,.4)}
.badge.gray{background:var(--navy-3);color:var(--gray-2)}
.badge.ok{background:rgba(34,197,94,.13);color:var(--ok);border-color:rgba(34,197,94,.4)}
.badge.err{background:rgba(239,68,68,.13);color:var(--err);border-color:rgba(239,68,68,.4)}
.badge.live{background:rgba(239,68,68,.16);color:#FF6B6B;border-color:rgba(239,68,68,.5);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.role-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:9.5px;font-weight:800;letter-spacing:.5px}
.role-LEADER{background:rgba(255,193,7,.15);color:var(--gold);border:1px solid rgba(255,193,7,.45)}
.role-ACTING_LEADER{background:rgba(255,145,0,.14);color:#FFA726;border:1px solid rgba(255,145,0,.45)}
.role-OFFICER{background:rgba(69,200,255,.14);color:var(--blue-2);border:1px solid rgba(69,200,255,.45)}
.role-MEMBER{background:var(--navy-3);color:var(--gray-2);border:1px solid var(--line)}
.role-name{font-weight:800}

/* ===== INPUTS ===== */
.input{width:100%;background:var(--navy-3);border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px 14px;font-size:15px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--blue)}
.input::placeholder{color:var(--gray-2)}
select.input{appearance:none;-webkit-appearance:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--gray);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-form .field{margin-bottom:20px}
.big-form label{font-size:13px;margin-bottom:9px;letter-spacing:.4px}
.big-form .input{padding:16px;font-size:16.5px;min-height:58px;border-radius:14px}
.big-form textarea.input{min-height:0;padding:16px}
.big-form .chip{padding:12px 20px;font-size:15px}
.elig-note{margin-top:10px;padding:11px 13px;border-radius:11px;border:1px solid rgba(193,154,107,.45);background:rgba(193,154,107,.06);color:var(--gray);font-size:12.5px;font-weight:600}
@keyframes bannerIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.banner-in{animation:bannerIn .5s var(--ease)}
@keyframes spinRing{to{transform:rotate(360deg)}}
.uploading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;background:rgba(3,2,32,.35)}
.upload-ring{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spinRing .75s linear infinite;margin:0 auto 10px}
@keyframes barSlide{0%{left:-45%}100%{left:105%}}
.upload-bar{width:70%;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;margin-top:10px}
.upload-bar span{position:absolute;top:0;left:-45%;width:45%;height:100%;border-radius:99px;background:var(--gold);animation:barSlide 1s ease-in-out infinite}
#clock-ov{position:fixed;inset:0;z-index:210;background:rgba(2,1,26,.92);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.clk-panel{background:var(--navy-2);width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:sheetUp .3s var(--ease)}
.clk-digital{display:flex;align-items:center;justify-content:center;gap:14px}
.clk-big{font-size:46px;font-weight:900;letter-spacing:1px;line-height:1}
.clk-big span{color:var(--gold)}
.clk-amp{width:46px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--navy-3);color:var(--gray);font-size:12px;font-weight:800;cursor:pointer}
.clk-amp.on{background:var(--gold);color:#1A2B3C;border-color:var(--gold)}
.clk-dial{position:relative;width:252px;height:252px;margin:18px auto 6px;border-radius:50%;background:var(--navy-3);border:1px solid var(--line)}
.clk-hand{position:absolute;left:50%;top:calc(50% - 92px);width:3px;height:92px;background:var(--gold);transform-origin:50% 100%;transform:translateX(-50%) rotate(0deg);transition:transform .18s var(--ease);border-radius:3px}
.clk-dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--gold);z-index:2}
.clk-num{position:absolute;left:calc(50% - 19px);top:calc(50% - 19px);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--gray);cursor:pointer;z-index:3;border:none;background:transparent;font-family:inherit}
.clk-num.sel{background:var(--gold);color:#1A2B3C}
.clk-mode{text-align:center;font-size:11.5px;font-weight:800;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;margin:8px 0 14px}
#map-ov{position:fixed;inset:0;z-index:200;background:var(--navy);display:flex;flex-direction:column;animation:fadeIn .2s ease}
.map-head{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;border-bottom:1px solid var(--line-soft);flex-shrink:0}
.map-body{flex:1;overflow-y:auto;padding:16px}
.map-frame{width:100%;height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:14px;background:var(--navy-3)}
.map-frame iframe{width:100%;height:100%;border:0;display:block}
.mp-res{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:13px;margin-top:8px;cursor:pointer;background:var(--navy-3)}
.mp-res.sel{border-color:var(--gold)}
.map-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);flex-shrink:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chip-select{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:999px;background:var(--navy-3);border:1px solid var(--line);color:var(--gray);font-size:13px;font-weight:700;cursor:pointer;transition:all .18s}
.chip.active{background:rgba(26,91,255,.18);border-color:var(--blue);color:var(--blue-2)}
.chip.gold.active{background:rgba(255,193,7,.14);border-color:var(--gold);color:var(--gold)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--navy-3);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:14px;color:var(--gray-2)}
.searchbar input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px}

/* ===== AVATAR ===== */
.avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--blue),#123BB5);letter-spacing:.5px}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:34px;height:34px;border-radius:10px;font-size:11px}
.avatar.lg{width:64px;height:64px;border-radius:18px;font-size:18px}
.avatar.xl{width:92px;height:92px;border-radius:26px;font-size:26px}
.av-0{background:linear-gradient(135deg,#1A5BFF,#123BB5)}.av-1{background:linear-gradient(135deg,#7C3AED,#4F46E5)}
.av-2{background:linear-gradient(135deg,#0EA5E9,#0369A1)}.av-3{background:linear-gradient(135deg,#059669,#047857)}
.av-4{background:linear-gradient(135deg,#DC2626,#B91C1C)}.av-5{background:linear-gradient(135deg,#D97706,#B45309)}
.av-6{background:linear-gradient(135deg,#DB2777,#BE185D)}.av-7{background:linear-gradient(135deg,#475569,#334155)}
.team-logo{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:14px;flex-shrink:0;overflow:hidden}
.team-logo img{width:100%;height:100%;object-fit:cover}
.team-logo.sm{width:36px;height:36px;border-radius:11px;font-size:12px}
.team-logo.lg{width:60px;height:60px;border-radius:17px;font-size:18px}

/* ===== LAYOUT HELPERS ===== */
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--gray-2);font-size:12.5px}
.tiny{font-size:11px;color:var(--gray-2)}
.section-h{font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.section-h:first-child{margin-top:2px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex-shrink:0;width:250px}
.hr{height:1px;background:var(--line-soft);margin:14px 0;border:none}

/* ===== TABS (segmented) ===== */
.tabbar{display:flex;background:var(--navy-3);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:14px;gap:4px}
.tab{flex:1;padding:9px 6px;border-radius:10px;background:none;border:none;color:var(--gray-2);font-size:11.5px;font-weight:800;letter-spacing:.7px}
.tab.active{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;box-shadow:0 4px 12px rgba(26,91,255,.3)}

/* ===== EMPTY STATE ===== */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 24px}
.empty .e-ico{width:76px;height:76px;border-radius:24px;background:var(--navy-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gray-2);margin-bottom:16px}
.empty .e-title{font-size:16px;font-weight:800;margin-bottom:6px}
.empty .e-body{font-size:13px;color:var(--gray-2);max-width:260px;margin-bottom:16px}

/* ===== TOURNEY CARD ===== */
.tour-card{width:100%;text-align:left;border:1px solid var(--line-soft);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--navy-2),#071029);position:relative;color:#E8EDF5;display:block;margin-bottom:12px}
.tour-banner{aspect-ratio:16/9;height:auto;background:linear-gradient(120deg,var(--tc,#1A5BFF),#123BB5);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tour-banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tour-banner .tb-initials{font-size:34px;font-weight:900;opacity:.25;letter-spacing:2px}
.tb-logo-corner{position:absolute;top:10px;left:10px;z-index:2}
.tb-logo-corner .team-logo.sm{width:38px;height:38px;border-radius:13px}
.tb-name-big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 18px 14px;font-size:17px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 10px rgba(0,0,0,.5);z-index:1}
.tour-banner .tour-status{position:absolute;top:10px;right:10px}
.tour-body{padding:14px}
.tour-body .t-name{font-size:16px;font-weight:800;margin-bottom:3px}
.tour-body .t-meta{font-size:12px;color:var(--gray-2);display:flex;align-items:center;gap:6px;margin-bottom:2px}
.tour-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line-soft)}
.tour-foot .t-entry{font-size:13px;font-weight:800;color:var(--gold)}
.tour-foot .t-count{font-size:11.5px;color:var(--gray-2);font-weight:700}

/* ===== TEAM CARD ===== */
.team-card{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--navy-2),#071029);border:1px solid var(--line-soft);margin-bottom:11px;width:100%;text-align:left;color:#E8EDF5;position:relative;overflow:hidden}
.team-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(69,200,255,.5),transparent)}
.team-card .tc-name{font-size:15px;font-weight:800;margin-bottom:2px}
.team-card .tc-meta{font-size:11.5px;color:var(--gray-2)}
.team-form{display:flex;gap:3px}
.team-form span{width:17px;height:17px;border-radius:5px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.team-form .W{background:rgba(34,197,94,.18);color:var(--ok)}
.team-form .D{background:var(--navy-3);color:var(--gray)}
.team-form .L{background:rgba(239,68,68,.18);color:var(--err)}

/* ===== MATCH CARD ===== */
.match-card{padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--navy-2),#071029);border:1px solid var(--line-soft);margin-bottom:11px}
.match-card .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.match-card .mc-comp{font-size:11px;font-weight:700;color:var(--gray-2);letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.mc-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:11px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.mc-team .n{font-size:12px;font-weight:700;line-height:1.25}
.mc-num{font-size:26px;font-weight:900;text-align:center;min-width:44px}
.mc-vs{font-size:11px;color:var(--gray-2);font-weight:800;text-align:center;min-width:44px}
.mc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc-events{margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.mc-events .ev{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray)}

/* ===== PLAYER CARD / ROW ===== */
.player-card{width:158px;border-radius:16px;background:linear-gradient(180deg,var(--navy-2),#071029);border:1px solid var(--line-soft);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.player-card .pc-name{font-size:13px;font-weight:800;line-height:1.2}
.player-list-card{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--navy-2),#071029);border:1px solid var(--line-soft);margin-bottom:11px;width:100%;text-align:left;position:relative;overflow:hidden;color:#E8EDF5}
.player-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.player-row:last-child{border-bottom:none}

/* ===== PRIZE SLOTS ===== */
.prize-slot{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:14px;background:var(--navy-3);border:1px solid var(--line);margin-bottom:9px}
.prize-slot .ps-rank{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0}
.prize-slot.p1{background:linear-gradient(120deg,rgba(255,193,7,.14),rgba(255,193,7,.04));border-color:rgba(255,193,7,.45)}
.prize-slot.p1 .ps-rank{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1A2B3C}
.prize-slot.p2{border-color:rgba(200,210,225,.35)}
.prize-slot.p2 .ps-rank{background:linear-gradient(135deg,#CBD5E1,#94A3B8);color:#1A2B3C}
.prize-slot.p3{border-color:rgba(205,127,50,.4)}
.prize-slot.p3 .ps-rank{background:linear-gradient(135deg,#D97706,#B45309);color:#fff}
.prize-slot.p4{border-color:rgba(120,113,108,.35)}
.prize-slot.p4 .ps-rank{background:linear-gradient(135deg,#57534E,#3F3F46);color:#fff}

/* ===== BRACKET ===== */
.bracket-round{margin-bottom:20px}
.bracket-round .br-title{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
.bracket-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;margin-bottom:9px}
.bracket-edit-slot{min-height:52px;border-radius:12px;border:1.5px dashed var(--line);background:var(--navy-3);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:700;color:var(--gray-2);padding:6px;cursor:pointer;text-align:center}
.bracket-edit-slot.filled{border-style:solid;background:var(--navy-2);color:#E8EDF5;border-color:var(--line)}
.bracket-edit-slot.winner{border-color:var(--gold);background:rgba(255,193,7,.1);color:var(--gold)}
.bracket-slot{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--navy-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--gray);padding:6px;text-align:center}
.bracket-slot.winner{border-color:var(--gold);background:rgba(255,193,7,.1);color:var(--gold)}
.bracket-slot.tbd{border-style:dashed;color:var(--gray-2)}
.bracket-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;color:var(--gray-2);font-size:10px;font-weight:800}
.champ-card{background:linear-gradient(120deg,rgba(255,193,7,.16),rgba(255,193,7,.05));border:1px solid rgba(255,193,7,.5);border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px;text-align:center}

/* ===== FUND ===== */
.fund-card{background:linear-gradient(135deg,#0F2036,#071029);border:1px solid rgba(255,193,7,.35);border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.fund-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,193,7,.6),transparent)}
.fund-card .fc-label{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
.fund-card .fc-balance{font-size:34px;font-weight:900;letter-spacing:-.5px}
.fund-card .fc-sub{font-size:11.5px;color:var(--gray-2);margin-top:4px}
.txn-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line-soft)}
.txn-row:last-child{border-bottom:none}
.txn-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txn-ico.credit{background:rgba(34,197,94,.13);color:var(--ok)}
.txn-ico.debit{background:rgba(239,68,68,.13);color:var(--err)}
.txn-amt{font-weight:800;font-size:14px}
.txn-amt.credit{color:var(--ok)}
.txn-amt.debit{color:var(--err)}

/* ===== APPROVALS ===== */
.approval-bar{height:9px;border-radius:9px;background:var(--navy-3);border:1px solid var(--line);overflow:hidden;display:flex;margin:10px 0}
.approval-bar .ab-ok{background:linear-gradient(90deg,var(--ok),#4ADE80);height:100%}
.approval-bar .ab-no{background:rgba(239,68,68,.6);height:100%;margin-left:auto}
.vote-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line-soft)}
.vote-row:last-child{border-bottom:none}
.vote-status{margin-left:auto}

/* ===== TOAST ===== */
#toast-root{position:fixed;top:calc(env(safe-area-inset-top) + 44px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:rgba(13,27,42,.97);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:toastIn .34s var(--ease)}
.toast.ok{border-color:rgba(34,197,94,.5)}
.toast.ok .t-ico{color:var(--ok)}
.toast.err{border-color:rgba(239,68,68,.5)}
.toast.err .t-ico{color:var(--err)}
.toast.gold{border-color:rgba(255,193,7,.5)}
.toast.gold .t-ico{color:var(--gold)}
.toast.hide{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px)}}

/* ===== MODAL ===== */
#modal-root{position:fixed;inset:0;z-index:400;display:none}
#modal-root.show{display:flex;align-items:center;justify-content:center;padding:24px}
#modal-root .mr-bg{position:absolute;inset:0;background:rgba(3,11,20,.72);backdrop-filter:blur(4px);animation:fadeIn .25s}
.modal{position:relative;width:100%;max-width:380px;background:linear-gradient(180deg,var(--navy-2),var(--navy));border:1px solid var(--line);border-radius:20px;padding:22px;animation:popIn .3s var(--ease)}
.modal .m-title{font-size:17px;font-weight:800;margin-bottom:8px}
.modal .m-body{font-size:13.5px;color:var(--gray);margin-bottom:18px;line-height:1.55}
.modal .m-actions{display:flex;gap:10px}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* ===== SHEET ===== */
#sheet-root{position:fixed;inset:0;z-index:350;display:none}
#sheet-root.show{display:block}
#sheet-root .sr-bg{position:absolute;inset:0;background:rgba(3,11,20,.65);backdrop-filter:blur(3px);animation:fadeIn .25s}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--navy-2);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:sheetUp .34s var(--ease);max-height:78dvh;overflow-y:auto}
@keyframes sheetUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet .sh-handle{width:42px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 16px}
.sheet .sh-title{font-size:16px;font-weight:800;margin-bottom:14px}
.sheet-opt{display:flex;align-items:center;gap:14px;padding:14px 10px;border-radius:14px;background:none;border:none;width:100%;text-align:left;color:#E8EDF5;margin-bottom:4px}
.sheet-opt:active{background:var(--navy-3)}
.sheet-opt .so-ico{width:42px;height:42px;border-radius:13px;background:var(--navy-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--blue-2);flex-shrink:0}
.sheet-opt .so-title{font-size:14.5px;font-weight:700;margin-bottom:1px}
.sheet-opt .so-sub{font-size:11.5px;color:var(--gray-2)}

/* ===== MISC ===== */
.hero-carousel{border-radius:20px;overflow:hidden;position:relative;margin-bottom:6px;scroll-snap-type:x mandatory;display:flex;overflow-x:auto;scrollbar-width:none}
.hero-carousel::-webkit-scrollbar{display:none}
.hero-slide{min-width:100%;scroll-snap-align:center;padding:26px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.hero-dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.hero-dots span{width:6px;height:6px;border-radius:9px;background:var(--line);transition:all .25s}
.hero-dots span.on{width:18px;background:var(--gold)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.stat-box{background:var(--navy-3);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat-box .sv{font-size:19px;font-weight:900;color:var(--gold)}
.stat-box .sl{font-size:9.5px;font-weight:700;color:var(--gray-2);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:4px}
.quick-opt{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;border-radius:15px;background:linear-gradient(180deg,var(--navy-2),#071029);border:1px solid var(--line-soft);color:#E8EDF5;font-size:10px;font-weight:700;letter-spacing:.3px}
.quick-opt .q-ico{width:38px;height:38px;border-radius:12px;background:var(--navy-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.otp-row{display:flex;gap:10px;justify-content:center;margin:22px 0}
.otp-box{width:46px;height:54px;border-radius:14px;background:var(--navy-3);border:1.5px solid var(--line);color:#fff;font-size:22px;font-weight:800;text-align:center;outline:none;caret-color:var(--gold)}
.otp-box:focus{border-color:var(--blue)}
.phone-wrap{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:13px;background:var(--navy-3);overflow:hidden}
.phone-wrap .pw-cc{padding:13px 14px;font-size:15px;font-weight:700;color:var(--gray);border-right:1px solid var(--line)}
.phone-wrap input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;padding:13px}
.notif-row{display:flex;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line-soft)}
.notif-row:last-child{border-bottom:none}
.notif-row .n-ico{width:40px;height:40px;border-radius:13px;background:var(--navy-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--blue-2);flex-shrink:0}
.notif-row.unread .n-ico{background:rgba(255,193,7,.12);border-color:rgba(255,193,7,.4);color:var(--gold)}
.unread-pill{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:6px}
.onb-slide{text-align:center;padding:30px 26px;display:flex;flex-direction:column;align-items:center;gap:14px}
.onb-art{width:130px;height:130px;border-radius:40px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.form-banner{aspect-ratio:16/9;height:auto;border-radius:16px;background:linear-gradient(120deg,var(--tc,#1A5BFF),#123BB5);display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--line-soft)}
.form-banner .fb-hint{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.5px;text-align:center;line-height:1.5}
.form-banner img{width:100%;height:100%;object-fit:cover}
.qr-box{width:100%;aspect-ratio:1;border-radius:14px;background:var(--navy-3);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.qr-box img{width:100%;height:100%;object-fit:cover}
.rules-box{background:var(--navy-3);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13px;color:var(--gray);line-height:1.7;white-space:pre-line}
.permission-art{width:96px;height:96px;border-radius:30px;background:var(--navy-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--blue-2);margin:0 auto 20px}
.notif-bell{position:relative}
.notif-bell .nb-dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--err);border:2px solid var(--navy)}
.greet{font-size:13px;color:var(--gray-2);font-weight:600}
.greet .g-name{font-size:19px;font-weight:900;color:#fff;display:block;margin-top:2px}
.onb-count{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--gray-2);min-width:44px;text-align:right}
.onb-slide{justify-content:center}
.avail-strip{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
button:active{transform:scale(.96)}
</style>
</head>

<div id="sheet-root"></div>

'use strict';
/* ================= CONSTANTS ================= */
const LS_KEY='nex_football_demo_v5';
const ROLE={LEADER:'LEADER',ACTING:'ACTING_LEADER',OFFICER:'OFFICER',MEMBER:'MEMBER'};
const ROLE_LIMITS={LEADER:1,ACTING_LEADER:2,OFFICER:5};
const MAX_MEMBERS=50;
const MAX_TEAMS_OPTIONS=[2,4,8,16,32,64,128];
const APPROVAL_THRESHOLD=0.6;
const POSITIONS=['GK','CB','LB','RB','DM','CM','CAM','LW','RW','ST'];
const TEAM_COLORS=['#1A5BFF','#7C3AED','#0EA5E9','#059669','#DC2626','#D97706','#DB2777','#475569'];
const AREAS=['Andheri','Bandra','Colaba','Dadar','Powai','Worli','Juhu','Versova','Sakinaka','Goregaon'];

var AREA_LIST=null;
function areaList(){return (AREA_LIST&&AREA_LIST.length)?AREA_LIST:AREAS;}
function fetchAreaList(){
  try{
    SB.from('areas').select('name').order('name',{ascending:true}).then(function(res){
      if(res&&res.data&&res.data.length)AREA_LIST=res.data.map(function(r){return r.name;});
    }).catch(function(){});
  }catch(e){}
}
function areaFieldHTML(id,val){
  var list=areaList();
  return '<input id="'+id+'" class="input" list="dl-'+id+'" autocomplete="off" placeholder="Search or type your area" value="'+esc(val||'')+'">'
    +'<datalist id="dl-'+id+'">'+list.map(function(a){return '<option value="'+esc(a)+'"></option>';}).join('')+'</datalist>';
}
function maybeAddArea(name){
  name=(name||'').trim();
  if(!name)return name;
  if(!AREA_LIST)AREA_LIST=AREAS.slice();
  if(AREA_LIST.indexOf(name)<0){
    AREA_LIST.push(name);
    try{SB.from('areas').insert([{name:name}]).then(function(){},function(){});}catch(e){}
  }
  return name;
}
function areaVal(id){var el=document.getElementById(id);if(!el)return '';return maybeAddArea(el.value);}

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
function fmt(n){return '\u20B9'+new Intl.NumberFormat('en-IN').format(n||0);}
function num(n){return new Intl.NumberFormat('en-IN').format(n||0);}
function nowTs(){return Date.now();}
function initialsOf(name){const p=String(name||'?').trim().split(/\s+/);return (p[0]?p[0][0]:'?')+(p[1]?p[1][0]:'');}
function hashId(s){let h=0;for(let i=0;i<String(s).length;i++){h=(h*31+String(s).charCodeAt(i))>>>0;}return h;}
function uid(n){let out='';for(let i=0;i<n;i++){out+=Math.floor(Math.random()*10);}return out;}
function dayOf(ts){return new Date(ts).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function timeOf(ts){return new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase();}

function nexEmblem(size){
  const sz=size||120;
  return '<img src="'+NEX_LOGO_CLEAN+'" width="'+sz+'" height="'+sz+'" alt="NEX FOOTBALL" style="display:block;object-fit:contain">';

/* ================= STATE ================= */
let STATE=null;
let NAV_STACK=[];
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(STATE));}catch(e){}scheduleSync();}
function P(id){return STATE.players.find(p=>p.id===id)||null;}
function T(id){return STATE.teams.find(t=>t.id===id)||null;}
function TR(id){return STATE.tournaments.find(t=>t.id===id)||null;}
function M(id){return STATE.matches.find(m=>m.id===id)||null;}
function cur(){return STATE.currentUser?P(STATE.currentUser):null;}
function memLbl(n){n=Number(n)||0;return n+' member'+(n===1?'':'s');}
function ageFromDob(dob){
  if(!dob)return null;
  var d=new Date(dob+'T00:00:00');
  if(isNaN(d.getTime()))return null;
  var n=new Date();
  var a=n.getFullYear()-d.getFullYear();
  var m=n.getMonth()-d.getMonth();
  if(m<0||(m===0&&n.getDate()<d.getDate()))a--;
  return a;
}
function ageOf(p){
  if(!p)return null;
  var a=p.dob?ageFromDob(p.dob):null;
  if(a!=null&&a>=0)return a;
  var n=parseInt(p.age,10);
  return isNaN(n)?null:n;
}
function ageText(p){var a=ageOf(p);return (a==null?'-':String(a))+' yrs';}
function dobMax(){var n=new Date();return n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);}
function dobHint(id,hintId){var el=document.getElementById(id);var h=document.getElementById(hintId);if(!el||!h)return;var a=ageFromDob(el.value);h.textContent=(a==null?'':('Age: '+a+' years'));}

function myTeam(){if(!STATE.currentUser)return null;const me=cur();if(!me)return null;for(const t of STATE.teams){if(t.members.some(m=>m.playerId===me.id))return t;}return null;}
function roleIn(team){if(!team||!STATE.currentUser)return null;const me=cur();if(!me)return null;const m=team.members.find(x=>x.playerId===me.id);return m?m.role:null;}
function myRole(){return roleIn(myTeam());}
function isLeader(){return myRole()===ROLE.LEADER;}
function isActing(){return myRole()===ROLE.ACTING;}
function isOfficer(){return myRole()===ROLE.OFFICER;}
function isStaff(){const r=myRole();return r===ROLE.LEADER||r===ROLE.ACTING||r===ROLE.OFFICER;}
function canManageTeam(){return isStaff();}
function canAddMembers(){return isLeader()||isOfficer();}
function canRemoveMembers(){return isLeader();}
function canChallenge(){return isLeader()||isActing();}
function canCreateTournament(){return isLeader()||isActing();}
function canPromoteToRole(role){if(isLeader())return true;if(isActing()&&(role===ROLE.OFFICER||role===ROLE.MEMBER||role===ROLE.ACTING))return true;return false;}
function canManageTournament(tr){if(!tr)return false;const t=myTeam();if(!t)return false;if(tr.organizerTeam!==t.id)return false;return isStaff();}
function avatar(p,cls){if(!p)return '<div class="avatar '+(cls||'')+'">?</div>';if(p.photo)return '<div class="avatar '+(cls||'')+'"><img src="'+p.photo+'" alt=""></div>';return '<div class="avatar '+(cls||'')+' av-'+(hashId(p.id)%8)+'">'+esc(p.initials)+'</div>';}
function teamLogo(t,cls){if(!t)return '<div class="team-logo '+(cls||'')+'">?</div>';if(t.logo)return '<div class="team-logo '+(cls||'')+'"><img src="'+t.logo+'" alt=""></div>';return '<div class="team-logo '+(cls||'')+'" style="background:'+esc(t.color)+'">'+esc(t.initials)+'</div>';}
function roleBadge(role){return '<span class="role-badge role-'+esc(role)+'">'+esc(roleName(role))+'</span>';}
function roleName(r){return r===ROLE.LEADER?'LEADER':r===ROLE.ACTING?'ACTING LEADER':r===ROLE.OFFICER?'OFFICER':'MEMBER';}
function statusBadge(st){const cls=st==='OPEN'?'ok':st==='LIVE'?'live':st==='FULL'?'gold':'gray';return '<span class="badge '+cls+'">'+esc(st)+'</span>';}

/* ================= TOAST / MODAL / SHEET ================= */
function toast(msg,type){
  const root=$('#toast-root');
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  const ico=type==='ok'?'check':type==='err'?'x':type==='gold'?'star':'info';
  el.innerHTML='<span class="t-ico">'+I(ico,18)+'</span><span>'+esc(msg)+'</span>';
  root.appendChild(el);
  setTimeout(()=>{el.classList.add('hide');setTimeout(()=>{el.remove();},320);},2600);
}
function showModal(opts){
  const root=$('#modal-root');
  root.innerHTML='<div class="mr-bg" onclick="closeModal()"></div>'
  +'<div class="modal"><div class="m-title">'+esc(opts.title||'')+'</div>'
  +'<div class="m-body">'+(opts.body||'')+'</div>'
  +'<div class="m-actions">'
  +(opts.cancel!==false?'<button class="btn secondary" onclick="closeModal()">'+esc(opts.cancel||'Cancel')+'</button>':'')
  +'<button class="btn '+(opts.destructive?'danger':'primary')+'" id="modal-ok-btn">'+esc(opts.ok||'OK')+'</button>'
  +'</div></div>';
  root.classList.add('show');
  $('#modal-ok-btn').onclick=()=>{closeModal();if(opts.onOk)opts.onOk();};
}
function closeModal(){const root=$('#modal-root');root.classList.remove('show');root.innerHTML='';}
function showSheet(html){
  const root=$('#sheet-root');
  root.innerHTML='<div class="sr-bg" onclick="closeSheet()"></div><div class="sheet"><div class="sh-handle"></div>'+html+'</div>';
  root.classList.add('show');
}
function closeSheet(){const root=$('#sheet-root');root.classList.remove('show');root.innerHTML='';}

/* ================= IMAGE PICKER ================= */
function pickImage(cb,capture,bucket){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';if(capture)inp.setAttribute('capture','environment');
  inp.style.display='none';
  document.body.appendChild(inp);
  inp.addEventListener('change',function(){
    const f=inp.files&&inp.files[0];
    if(!f){inp.remove();return;}
    if(f.size>5*1024*1024){toast('Image too large (max 5 MB)','err');inp.remove();return;}
    const rd=new FileReader();
    rd.onload=function(){
      const dataUrl=String(rd.result);
      if(SB&&SB_ONLINE&&AUTH_UID&&bucket){uploadToSB(f,bucket,function(url){cb(url||dataUrl);});}
      else{cb(dataUrl);}
      inp.remove();
    };
    rd.onerror=function(){toast('Could not read image','err');inp.remove();};
    rd.readAsDataURL(f);
  });
  inp.click();
}

let MEDIA_CB=null,MEDIA_BUCKET=null;

  MEDIA_CB=cb;MEDIA_BUCKET=bucket||null;

  +'<button class="sheet-opt" onclick="mediaSource(\'gallery\')"><span class="so-ico">'+I('img',20)+'</span>'
  +'<span><span class="so-title">Choose from gallery</span><span class="so-sub" style="display:block">Pick a saved image from your phone</span></span></button>';
  if(withLogoPreset&&typeof PRESET_LOGOS!=='undefined'){

function tryMigrateStorage(){

function optimizeStoredMedia(){
  try{
    if(localStorage.getItem('nex_media_opt')==='1')return;
    if(!SB_ONLINE||!AUTH_UID)return;
    var urls=[];
    (STATE.teams||[]).forEach(function(t){if(t.logo&&(''+t.logo).indexOf('supabase.co/storage')>=0)urls.push(t.logo);});
    (STATE.players||[]).forEach(function(p){if(p.photo&&(''+p.photo).indexOf('supabase.co/storage')>=0)urls.push(p.photo);});
    (STATE.tournaments||[]).forEach(function(t){if(t.banner&&(''+t.banner).indexOf('supabase.co/storage')>=0)urls.push(t.banner);});
    var uniq=[];urls.forEach(function(u){if(uniq.indexOf(u)<0)uniq.push(u);});
    if(!uniq.length){try{localStorage.setItem('nex_media_opt','1');}catch(e){}return;}
    var left=uniq.length;
    var tick=function(){left--;if(left<=0){try{localStorage.setItem('nex_media_opt','1');}catch(e){}}};
    uniq.forEach(function(u){
      var m=(''+u).match(/\/storage\/v1\/object\/(?:public\/)?([^\/]+)\/(.+?)(?:\?.*)?$/);
      if(!m){tick();return;}
      var bucket=m[1],name=m[2];
      var img=new Image();
      img.crossOrigin='anonymous';
      img.onload=function(){
        try{
          var MAX=900;var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
          if(!w||!h){tick();return;}
          var sc=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
          var cv=document.createElement('canvas');cv.width=w;cv.height=h;
          var cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
          cv.toBlob(function(blob){
            if(!blob){tick();return;}
            SB.storage.from(bucket).upload(name,blob,{upsert:true,contentType:'image/jpeg'}).then(function(){tick();}).catch(function(){tick();});
          },'image/jpeg',0.82);
        }catch(e){tick();}
      };
      img.onerror=function(){tick();};
      img.src=u;
    });
  }catch(e){}
}
function finishBoot(){
  if(!window.__v62Checked){window.__v62Checked=true;try{checkAppUpdate();fetchSliderImages();fetchAreaList();}catch(e){}}
  try{tryMigrateStorage();}catch(e){}
  setTimeout(function(){try{optimizeStoredMedia();}catch(e){}},4000);
  const start=(!STATE.onboarded)?'onboarding':(STATE.currentUser)?'home':(PENDING_SIGNUP?'profile-setup':'login');
  replace(start);
}

function teamMeetsEligibility(tr,team){
  if(tr.eligibility.type==='ALL')return {ok:true,fail:[]};
  const fail=[];
  team.members.forEach(function(mm){
    const p=P(mm.playerId);if(!p)return;
    if(tr.eligibility.type==='HEIGHT'&&p.height>tr.eligibility.maxHeight)fail.push(p.name+' ('+p.height+' cm)');
    if(tr.eligibility.type==='AGE'&&ageOf(p)!=null&&ageOf(p)>tr.eligibility.maxAge)fail.push(p.name+' ('+ageText(p)+')');
  });
  return {ok:fail.length===0,fail:fail};
}

  team.members.forEach(function(x){if(x.playerId===pid)m=x;});

  if(m.role===ROLE.LEADER&&!isLeader()){toast('Only the leader can manage the leader','err');return;}

/* ================= BRACKET ENGINE ================= */
function computeBracket(seed,winners){
  const rounds=[];let cur=seed.slice();
  while(cur.length>1){
    const ms=[];
    for(let i=0;i<cur.length;i+=2){
      const a=(cur[i]!==undefined?cur[i]:null);
      const b=(cur[i+1]!==undefined?cur[i+1]:null);
      const key='r'+rounds.length+'-m'+ms.length;
      let w=(winners&&winners[key]!==undefined?winners[key]:null);
      if(!w&&a&&!b)w=a;
      else if(!w&&b&&!a)w=b;
      ms.push({a:a,b:b,w:w});
    }
    rounds.push(ms);
    cur=ms.map(function(m){return m.w;});
  }
  return rounds;
}
function bracketChampion(seed,winners){
  const rounds=computeBracket(seed,winners);
  if(!rounds.length)return null;
  const fin=rounds[rounds.length-1][0];
  return fin?fin.w:null;
}
function cleanupBracketWinners(tr){
  const b=tr.bracket;const rounds=computeBracket(b.seed,b.winners);
  const clean={};
  rounds.forEach(function(ms,r){ms.forEach(function(m,mi){
    const key='r'+r+'-m'+mi;
    if(m.a&&m.b&&b.winners[key]!==undefined&&(b.winners[key]===m.a||b.winners[key]===m.b))clean[key]=b.winners[key];
  });});
  b.winners=clean;
}
function nextPow2(n){let p=1;while(p<n)p*=2;return p;}
function generateBracketForTournament(tr){
  const size=nextPow2(Math.max(2,tr.teams.length));
  const seed=tr.teams.slice(0,size);
  while(seed.length<size)seed.push(null);
  tr.bracket={seed:seed,winners:{},activeRound:0,published:tr.bracket?tr.bracket.published:false};
  cleanupBracketWinners(tr);save();
}
function roundName(idx,total){
  if(idx===total-1)return 'FINAL';
  if(idx===total-2)return 'SEMI-FINALS';
  const ms=Math.pow(2,total-1-idx);
  if(ms===4)return 'QUARTER-FINALS';
  return 'ROUND '+(idx+1);
}

function isMatchDay(ts){try{var d=new Date(ts),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}catch(e){return true;}}
function startTournamentNow(tid){
  const tr=TR(tid);
  if(!tr||!canManageTournament(tr)){toast('Only the organizer can start this tournament','err');return;}
  if(tr.status==='COMPLETED'){toast('Tournament already completed','err');return;}
  if(tr.status==='LIVE'){toast('Tournament already started','err');return;}
  if(tr.teams.length<2){toast('Add at least 2 teams before starting','err');return;}
  if(!isMatchDay(tr.date)){toast('You can start only on the match date ('+dayOf(tr.date)+')','err');return;}
  showModal({title:'Start tournament?',body:'This will lock <b>'+esc(tr.name)+'</b> for regular players, generate the bracket and publish it to all teams.<br><br>After the start, only <b>Leaders and Acting Leaders</b> can still join a team.',ok:'START',destructive:true,onOk:function(){
    generateBracketForTournament(tr);
    tr.bracket.published=true;
    tr.status='LIVE';
    pushNotif('Tournament started',tr.name+' has started. The bracket is now live.','flag');
    save();toast('Tournament started','gold');
    nav('view-bracket',{id:tr.id});
  }});
}
function finishTournament(tid){
  const tr=TR(tid);
  tr.status='COMPLETED';
  const champ=tr.bracket.seed.length?bracketChampion(tr.bracket.seed,tr.bracket.winners):null;
  if(champ){const ct=T(champ);pushNotif('Tournament completed',ct.name+' are the champions of '+tr.name+'.','crown');}
  save();toast('Tournament completed','gold');render(false,true);
}
function bracketRunnerUp(b){
  const rounds=computeBracket(b.seed,b.winners);
  if(!rounds.length)return null;
  const fin=rounds[rounds.length-1][0];
  if(!fin||!fin.w)return null;
  return fin.a===fin.w?fin.b:fin.a;
}
function tourFull(tr){return !!tr&&!!tr.maxTeams&&tr.teams.length>=tr.maxTeams;}
function syncTourFull(tr){
  if(!tr||!tr.maxTeams)return false;
  var full=tr.teams.length>=tr.maxTeams;
  if(full&&tr.status==='OPEN'){tr.status='FULL';return true;}
  if(!full&&tr.status==='FULL'){tr.status='OPEN';return true;}
  return false;
}
function decideTournamentRequest(rid,ok){
  const r=STATE.tournamentRequests.find(function(x){return x.id===rid;});
  if(!r)return;
  const tr=TR(r.tournamentId);
  if(tr&&tr.status==='COMPLETED'){toast('Tournament already completed','err');return;}
  if(ok&&tourFull(tr)){toast('Tournament is FULL — no more teams can be added','err');return;}
  r.status=ok?'APPROVED':'DECLINED';
  if(ok&&tr.teams.indexOf(r.teamId)<0)tr.teams.push(r.teamId);
  var becameFull=ok&&syncTourFull(tr);
  if(becameFull){pushNotif('Tournament full',tr.name+' is now FULL — '+tr.teams.length+' of '+tr.maxTeams+' teams confirmed.','trophy');}
  if(ok&&tr.status==='LIVE'&&tr.bracket&&tr.bracket.seed.length&&!Object.keys(tr.bracket.winners||{}).length)generateBracketForTournament(tr);
  save();
  toast(ok?(becameFull?'Team approved — tournament is now FULL':'Team approved'):'Request declined',ok?'ok':'err');
  render(false,true);
}

    });

  });
  if(canManage&&tr.status!=='COMPLETED'&&actR<rounds.length-1){
    const msA=rounds[actR]||[];

function activeRoundOf(tr){
  const b=tr.bracket;
  if(!b||!b.seed.length)return 0;
  if(typeof b.activeRound==='number')return Math.max(0,b.activeRound);
  const rounds=computeBracket(b.seed,b.winners);
  let r=0;
  while(r<rounds.length-1&&(rounds[r]||[]).every(function(m){return !m.a||!m.b||!!m.w;}))r++;
  return r;
}
function startNextGround(tid){
  const tr=TR(tid);
  if(!tr)return;
  if(!isMatchDay(tr.date)){toast('You can start only on the match date ('+dayOf(tr.date)+')','err');return;}
  const rounds=computeBracket(tr.bracket.seed,tr.bracket.winners);
  const actR=activeRoundOf(tr);
  if(actR>=rounds.length-1)return;
  const ms=rounds[actR]||[];
  if(ms.some(function(m){return m.a&&m.b&&!m.w;})){toast('Decide all matches of this ground first','err');return;}
  tr.bracket.activeRound=actR+1;
  save();
  toast(roundName(actR+1,rounds.length)+' started - winners advance','gold');
  pushNotif('Next round started',roundName(actR+1,rounds.length)+' matches are now live in '+tr.name+'.','flag');
  render(false,true);
}
function swapSeedSlots(tr,fromIdx,toIdx){

  tr.bracket.seed[toIdx]=tmp;
  cleanupBracketWinners(tr);save();

function tourVisible(t){

  if(t.status!=='COMPLETED'&&t.status!=='CANCELLED')return true;
  var doneAt=t.completedAt||t.cancelledAt||0;
  if(!doneAt){var d=t.date||0;if(!d)return true;doneAt=d+7*86400000;}
  return Date.now()<=doneAt+7*86400000;
}
function expireOldTournaments(){
  var ch=false;
  (STATE.tournaments||[]).forEach(function(t){
    if(!t)return;
    if(t.status!=='COMPLETED'&&t.status!=='CANCELLED'&&t.date&&Date.now()>t.date+7*86400000){
      t.status='COMPLETED';t.completedAt=Date.now();ch=true;
    }
    if(t.status==='COMPLETED'&&!t.completedAt)t.completedAt=t.date?t.date+7*86400000:Date.now();
    if(t.status==='CANCELLED'&&!t.cancelledAt)t.cancelledAt=Date.now();
  });
  if(ch)save();

function resetChampion(tid){

  if(rounds.length)delete tr.bracket.winners['r'+(rounds.length-1)+'-m0'];
  cleanupBracketWinners(tr);save();toast('Champion reset','ok');render(false,true);

function regenerateBracket(tid){
  showModal({title:'Regenerate bracket?',body:'All slots and winners will be rebuilt from the joined teams list. This cannot be undone.',ok:'Regenerate',destructive:true,onOk:function(){
    const tr=TR(tid);
    const size=nextPow2(Math.max(2,tr.teams.length));
    const seed=tr.teams.slice(0,size);while(seed.length<size)seed.push(null);
    tr.bracket={seed:seed,winners:{},published:false};

}

function evaluatePaymentApproval(pa){
  if(pa.status!=='PENDING')return;
  const team=T(pa.teamId);
  const yes=Object.keys(pa.approvals).length;
  const no=Object.keys(pa.rejections).length;
  const remaining=pa.memberCount-yes-no;
  if(team&&team.fund.balance<pa.amount){
    pa.status='FAILED';pa.reason='Insufficient team fund ('+fmt(team.fund.balance)+' available)';
    save();return;
  }
  if(yes>=pa.threshold){
    if(team){
      addFundTransaction(team,{type:'debit',amount:pa.amount,by:pa.createdBy,desc:(TR(pa.tournamentId)?TR(pa.tournamentId).name:'Payment')+' entry fee'});
    }
    pa.status='EXECUTED';pa.executedAt=nowTs();
    if(!(STATE.tournamentRequests||[]).some(function(r){return r.tournamentId===pa.tournamentId&&r.teamId===pa.teamId&&(r.status==='PENDING'||r.status==='APPROVED');}))STATE.tournamentRequests.unshift({id:'trq'+nowTs()+Math.floor(Math.random()*999),tournamentId:pa.tournamentId,teamId:pa.teamId,status:'PENDING',paid:true,time:nowTs()});
    pushNotif('Payment executed',fmt(pa.amount)+' debited from the team fund for '+(TR(pa.tournamentId)?TR(pa.tournamentId).name:'payment')+'.','wallet');
    save();return;
  }
  if(yes+remaining<pa.threshold){
    pa.status='REJECTED';pa.executedAt=nowTs();
    save();return;
  }
  save();
}

function votePayment(pid,approve){
  const pa=STATE.paymentApprovals.find(function(x){return x.id===pid;});
  if(!pa||pa.status!=='PENDING')return;
  const me=STATE.currentUser;
  if(approve){pa.approvals[me]=true;delete pa.rejections[me];}
  else{pa.rejections[me]=true;delete pa.approvals[me];}
  evaluatePaymentApproval(pa);
  const tr=TR(pa.tournamentId);
  if(pa.status==='EXECUTED')toast('Payment executed — '+tr.name,'gold');
  else if(pa.status==='REJECTED')toast('Payment rejected','err');
  else if(pa.status==='FAILED')toast('Payment failed — insufficient fund','err');
  else toast(approve?'Vote recorded: approve':'Vote recorded: reject','ok');
  render(false,true);
}
function autoApproveRemaining(pid){
  const pa=STATE.paymentApprovals.find(function(x){return x.id===pid;});
  if(!pa||pa.status!=='PENDING')return;
  const team=T(pa.teamId);
  team.members.forEach(function(m){
    if(pa.rejections[m.playerId]!==true)pa.approvals[m.playerId]=true;
  });
  evaluatePaymentApproval(pa);
  toast(pa.status==='EXECUTED'?'Payment executed':'Done','gold');
  render(false,true);
}

function decideJoinRequest(rid,ok){

  +'<div class="field"><input id="pin-new" class="input" type="password" inputmode="numeric" maxlength="'+len+'" placeholder="Enter '+len+' digits" style="text-align:center;letter-spacing:8px;font-size:22px"></div>'
  +'<button class="btn gold block" onclick="pinSave('+len+')">SAVE PIN</button>');

function pinSave(len){

function pinCheck(){

  else toast('Wrong PIN','err');

function challengeVotesNeeded(team){
  var staff=(team.members||[]).filter(function(m){return m.role===ROLE.LEADER||m.role===ROLE.ACTING||m.role===ROLE.OFFICER;}).length;
  return Math.max(1,Math.ceil(staff*0.6));
}

function sendChallengeV2(tid,amt){
  var team=myTeam();if(!team)return;
  var amount=parseInt(String(amt||'').replace(/\D/g,''),10)||0;
  if(amount<=0){toast('Enter the challenge amount','err');return;}
  var gEl=document.getElementById('ch-ground');
  var groundV=(gEl?gEl.value:'').trim();
  if(!groundV){toast('Enter the ground','err');return;}
  var dEl=document.getElementById('ch-date');
  var dateVal=dEl?dEl.value:'';
  var _ts=new Date();var _tds=_ts.getFullYear()+'-'+('0'+(_ts.getMonth()+1)).slice(-2)+'-'+('0'+_ts.getDate()).slice(-2);
  if(!dateVal){toast('Pick the challenge date','err');return;}
  if(dateVal<_tds){toast('You cannot pick a past date','err');return;}
  var dateTs=new Date(dateVal+'T12:00:00').getTime();
  var tEl=document.getElementById('ch-time');
  var timeV=tEl?tEl.value:'7:30 PM';
  pinSheet(function(){
    if(canChallenge()){
      STATE.challenges.push({id:'ch'+nowTs()+Math.floor(Math.random()*999),fromTeam:team.id,toTeam:tid,amount:amount,date:dateTs,time:timeV,ground:groundV,status:'PENDING',votesOut:{},votesIn:{}});
      pushNotif('Challenge sent',team.name+' challenged '+(T(tid)?T(tid).name:'')+' for '+fmt(amount)+'.','flag');
      save();toast('Challenge sent','ok');
    }else{
      var ch={id:'ch'+nowTs()+Math.floor(Math.random()*999),fromTeam:team.id,toTeam:tid,amount:amount,date:dateTs,time:timeV,ground:groundV,status:'TEAM_APPROVAL',initiator:STATE.currentUser,votesOut:{},votesIn:{}};
      if(isStaff())ch.votesOut[STATE.currentUser]=true;
      STATE.challenges.push(ch);
      pushNotif('Challenge approval','Your team must accept (60%) to send the challenge to '+(T(tid)?T(tid).name:'')+'.','vote');
      save();toast('Sent for team approval (60%)','ok');
    }
    render(false,true);
  },'Enter your PIN to send');
}
function voteChallengeOut(cid){
  if(!isStaff()){toast('Only officers, leader or acting leader can accept','err');return;}
  pinSheet(function(){
    var c=STATE.challenges.find(function(x){return x.id===cid;});
    var team=myTeam();
    if(!c||!team)return;
    c.votesOut=c.votesOut||{};
    c.votesOut[STATE.currentUser]=true;
    var yes=Object.keys(c.votesOut).length,need=challengeVotesNeeded(team);
    if(yes>=need){
      c.status='PENDING';
      pushNotif('Challenge sent',team.name+' approved the challenge - sent!','flag');
      toast('Team approved - challenge sent','ok');
    }else toast('Vote saved ('+yes+'/'+need+')','ok');
    save();render(false,true);
  },'Enter your PIN to accept');
}
function voteChallengeIn(cid){
  if(!isStaff()){toast('Only officers, leader or acting leader can accept','err');return;}
  pinSheet(function(){
    var c=STATE.challenges.find(function(x){return x.id===cid;});
    var team=myTeam();
    if(!c||!team)return;
    c.votesIn=c.votesIn||{};
    c.votesIn[STATE.currentUser]=true;
    var yes=Object.keys(c.votesIn).length,need=challengeVotesNeeded(team);
    if(yes>=need){
      c.status='ACCEPTED';
      STATE.matches.push({id:'m'+nowTs(),tournament:null,teamA:c.fromTeam,teamB:c.toTeam,date:c.date,time:c.time,ground:c.ground,status:'UPCOMING',scoreA:null,scoreB:null,minute:null,events:[],availability:{confirmed:[],declined:[]}});
      pushNotif('Challenge accepted',team.name+' accepted the friendly - fixture created!','flag');
      toast('Challenge accepted - fixture created','ok');
    }else toast('Accept saved ('+yes+'/'+need+')','ok');
    save();render(false,true);
  },'Enter your PIN to accept');
}
function decideChallenge(cid,ok){
  const c=STATE.challenges.find(function(x){return x.id===cid;});
  if(!c)return;
  c.status=ok?'ACCEPTED':'DECLINED';
  if(ok){
    STATE.matches.push({id:'m'+nowTs(),tournament:null,teamA:c.fromTeam,teamB:c.toTeam,date:c.date,time:c.time,ground:c.ground,status:'UPCOMING',scoreA:null,scoreB:null,minute:null,events:[],availability:{confirmed:[],declined:[]}});
  }
  save();toast(ok?'Challenge accepted — fixture created':'Challenge declined',ok?'ok':'err');render(false,true);
}

function doEditTournament(){
  var id=window.__EDIT_TR;var tr=id?TR(id):null;
  if(!tr){toast('Tournament not found','err');window.__EDIT_TR=null;nav('my-tournaments');return;}
  if(!canManageTournament(tr)){toast('Only the organizer can edit','err');return;}
  if(TOUR_BANNER_LOADING){toast('Banner is still uploading \u2014 please wait','err');return;}
  const name=($('#cr-name')?$('#cr-name').value:'').trim();
  const desc=($('#cr-desc')?$('#cr-desc').value:'').trim();
  let ground=($('#cr-ground')?$('#cr-ground').value:'').trim();
  const dateVal=($('#cr-date')?$('#cr-date').value:'');
  const rules=($('#cr-rules')?$('#cr-rules').value:'').trim();
  if(!ground&&CR_MAP&&CR_MAP.name)ground=CR_MAP.name;
  if(!name){toast('Enter the tournament name','err');return;}
  if(!desc){toast('Enter a short description','err');return;}
  if(!ground){toast('Enter the ground name or pick on map','err');return;}
  if(!dateVal){toast('Pick the tournament date','err');return;}
  var _td2=new Date();var _ts2=_td2.getFullYear()+'-'+('0'+(_td2.getMonth()+1)).slice(-2)+'-'+('0'+_td2.getDate()).slice(-2);
  if(dateVal<_ts2){toast('You cannot pick a past date','err');return;}
  if(!rules){toast('Enter at least one rule','err');return;}
  const fee=parseInt(($('#cr-fee')?$('#cr-fee').value:'2000'),10)||0;
  if(fee<=0){toast('Enter a valid entry fee','err');return;}
  const eligType=chipVal('cr-elig')||'ALL';
  const eligMax=parseInt(($('#cr-elig-max')?$('#cr-elig-max').value:'0'),10)||(eligType==='AGE'?25:182);
  const nTiers=parseInt(chipVal('cr-prizes')||'3',10);
  const keys=['first','second','third','fourth'];
  const prizes={};
  for(let i=0;i<nTiers;i++){const v=parseInt(($('#cr-prize-'+(i+1))?$('#cr-prize-'+(i+1)).value:'0'),10)||0;prizes[keys[i]]='\u20B9'+num(v);}
  if(prizes.first==='\u20B90'){toast('Enter the 1st prize amount','err');return;}
  tr.name=name;tr.initials=initialsOf(name);
  tr.description=desc;tr.ground=ground;tr.area=areaVal('cr-area');
  if(dateVal)tr.date=new Date(dateVal+'T12:00:00').getTime();
  tr.startTime=($('#cr-time')?$('#cr-time').value:'7:00 PM');
  tr.maxTeams=Math.max((tr.teams||[]).length,parseInt(chipVal('cr-max')||'8',10));
  tr.entry='\u20B9'+num(fee)+' / team';
  tr.prizeCount=nTiers;tr.prizes=prizes;
  tr.eligibility=eligType==='ALL'?{type:'ALL'}:{type:eligType,max:eligMax};
  tr.rules=rules;
  if(TOUR_BANNER)tr.banner=TOUR_BANNER;
  if(TOUR_QR)tr.qrCode=TOUR_QR;
  tr.whatsapp=waCollectNumbers();
  window.__EDIT_TR=null;
  save();toast('Tournament updated','ok');
  replace('tournament-details',{id:tr.id});
}

/* ---------- CLOCK TIME PICKER ---------- */
var CLK={h:7,m:0,mode:'HOUR',ap:'PM'};
function openClockPicker(){
  const el=$('#cr-time');
  const v=el&&el.value?el.value:'7:00 PM';
  const mm=String(v).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(mm){CLK.h=parseInt(mm[1],10)%12||12;CLK.m=parseInt(mm[2],10);CLK.ap=(mm[3]||'PM').toUpperCase();}
  CLK.mode='HOUR';
  const ov=document.createElement('div');ov.id='clock-ov';
  ov.innerHTML='<div class=\"clk-panel\">'
  +'<div class=\"row between\" style=\"margin-bottom:6px\"><div style=\"font-weight:800;font-size:15px\">Pick start time</div><button class=\"icon-btn\" onclick=\"closeClockPicker()\">'+I('x',18)+'</button></div>'
  +'<div class=\"clk-digital\"><div class=\"clk-big\" id=\"clk-big\"></div><div style=\"display:flex;flex-direction:column;gap:6px\"><button class=\"clk-amp\" id=\"clk-am\" onclick=\"clkAMPM(\'AM\')\">AM</button><button class=\"clk-amp\" id=\"clk-pm\" onclick=\"clkAMPM(\'PM\')\">PM</button></div></div>'
  +'<div class=\"clk-dial\" id=\"clk-dial\"><div class=\"clk-hand\" id=\"clk-hand\"></div><div class=\"clk-dot\"></div></div>'
  +'<div class=\"clk-mode\" id=\"clk-mode\"></div>'
  +'<button class=\"btn gold block\" onclick=\"clkDone()\">DONE</button></div>';
  document.body.appendChild(ov);
  clkRender();
}
function closeClockPicker(){const ov=$('#clock-ov');if(ov)ov.remove();}
function clkAMPM(ap){CLK.ap=ap;clkRender();}
function clkDisplay(){return (CLK.h<10?'0':'')+CLK.h+':<span>'+((CLK.m<10?'0':'')+CLK.m)+'</span>';}
function clkRender(){
  const big=$('#clk-big');if(big)big.innerHTML=clkDisplay();
  const am=$('#clk-am'),pm=$('#clk-pm');
  if(am)am.className='clk-amp'+(CLK.ap==='AM'?' on':'');
  if(pm)pm.className='clk-amp'+(CLK.ap==='PM'?' on':'');
  const md=$('#clk-mode');if(md)md.textContent=CLK.mode==='HOUR'?'Select hour':'Select minutes';
  const dial=$('#clk-dial');if(!dial)return;
  Array.from(dial.querySelectorAll('.clk-num')).forEach(function(n){n.remove();});
  for(let i=0;i<12;i++){
    const val=CLK.mode==='HOUR'?(i+1):(i*5===0?60:i*5);
    const b=document.createElement('button');b.className='clk-num';
    if((CLK.mode==='HOUR'&&CLK.h===val)||(CLK.mode==='MIN'&&(CLK.m%60)===(val%60)))b.className+=' sel';
    const ang=i*30;
    b.style.transform='rotate('+ang+'deg) translateY(-97px) rotate(-'+ang+'deg)';
    b.textContent=CLK.mode==='HOUR'?String(val):(val===60?'00':String(val));
    b.onclick=function(){clkPick(val);};
    dial.appendChild(b);
  }
  const ang=CLK.mode==='HOUR'?((CLK.h+11)%12)*30:(CLK.m%60)*6;
  const hand=$('#clk-hand');if(hand)hand.style.transform='translateX(-50%) rotate('+ang+'deg)';
}
function clkPick(val){
  if(CLK.mode==='HOUR'){CLK.h=val;CLK.mode='MIN';}
  else{CLK.m=val%60;CLK.mode='HOUR';}
  clkRender();
}
function clkDone(){
  const el=$('#cr-time');
  if(el)el.value=((CLK.h+11)%12+1)+':'+((CLK.m<10?'0':'')+CLK.m)+' '+CLK.ap;
  closeClockPicker();
  toast('Time set','ok');
}

function closeMapPicker(){const ov=$('#map-ov');if(ov)ov.remove();}
function mpSearch(){
  const q=($('#mp-q')?$('#mp-q').value:'').trim();
  if(!q){toast('Type a place to search','err');return;}
  const st=$('#mp-status');if(st)st.textContent='Searching\u2026';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q))
  .then(function(r){return r.json();})
  .then(function(list){
    const st2=$('#mp-status');if(st2)st2.textContent=list.length?'Tap a result to preview it on the map:':'No places found \u2014 try another search.';
    const box=$('#mp-res');if(!box)return;
    box.innerHTML='';
    list.forEach(function(p){
      const d=document.createElement('div');d.className='mp-res';
      d.innerHTML='<span style=\"color:var(--gold);flex-shrink:0\">'+I('pin',16)+'</span><div class=\"tiny\" style=\"line-height:1.5\">'+esc(p.display_name)+'</div>';
      d.onclick=function(){mpSelect(p,d);};
      box.appendChild(d);
    });
  })
  .catch(function(){const st3=$('#mp-status');if(st3)st3.textContent='Search failed \u2014 check your connection, or type the ground name manually.';});
}
function mpSelect(p,el){
  MAP_PICK={lat:parseFloat(p.lat),lon:parseFloat(p.lon),full:p.display_name||'',name:(p.display_name||'').split(',')[0].trim()};
  Array.from(document.querySelectorAll('.mp-res')).forEach(function(d){d.classList.remove('sel');});
  if(el)el.classList.add('sel');
  const map=$('#mp-map');
  if(map)map.innerHTML='<div class=\"map-frame\"><iframe src=\"https://maps.google.com/maps?q='+MAP_PICK.lat+','+MAP_PICK.lon+'&z=16&output=embed\"></iframe></div>'
  +'<div class=\"tiny\" style=\"margin-top:8px;color:var(--ok)\">'+I('check',12)+' Location preview loaded on the map</div>';
  const ok=$('#mp-ok');if(ok){ok.style.opacity='1';}
}
function mpConfirm(){
  if(!MAP_PICK){toast('Search and tap a place first','err');return;}
  CR_MAP={lat:MAP_PICK.lat,lon:MAP_PICK.lon,name:MAP_PICK.name};
  const g=$('#cr-ground');
  if(g&&!g.value.trim())g.value=MAP_PICK.name;
  const loc=$('#cr-loc');
  if(loc)loc.innerHTML='<span style=\"color:var(--ok)\">'+I('check',12)+' '+esc(MAP_PICK.full)+'</span>';
  closeMapPicker();
  toast('Location set on map','ok');
}
function mpHere(){
  const st=$('#mp-status');if(st)st.textContent='Getting your location\u2026';
  if(!navigator.geolocation){if(st)st.textContent='Location not supported on this device \u2014 use search instead.';return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon)
    .then(function(r){return r.json();})
    .then(function(p){mpSelect({lat:lat,lon:lon,display_name:(p&&p.display_name)||'My current location'});})
    .catch(function(){mpSelect({lat:lat,lon:lon,display_name:'My current location'});});
  },function(){const s2=$('#mp-status');if(s2)s2.textContent='Could not get your location \u2014 allow location access, or search instead.';},{timeout:8000});
}

function setAvailability(mid,going){
  const m=M(mid);if(!m)return;
  const me=STATE.currentUser;
  m.availability.confirmed=m.availability.confirmed.filter(function(x){return x!==me;});
  m.availability.declined=m.availability.declined.filter(function(x){return x!==me;});
  if(going)m.availability.confirmed.push(me);else m.availability.declined.push(me);
  save();toast(going?'Availability confirmed':'Marked unavailable','ok');render(false,true);
}
